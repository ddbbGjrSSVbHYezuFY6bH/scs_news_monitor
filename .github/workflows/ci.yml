name: Validate resolver

on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'queries.json'
      - 'package*.json'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
