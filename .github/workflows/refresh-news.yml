name: Refresh news
run-name: Refresh news (${{ inputs.requestId || github.run_id }})

on:
  schedule:
    - cron: '30 8 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      mode:
        description: 'active: all enabled, unexpired queries; selected: queryIds; custom: query or queries'
        type: choice
        options: [active, selected, custom]
        default: active
      queryIds:
        description: 'JSON array of saved IDs, for example ["kashmir"]'
        type: string
        default: '[]'
      query:
        description: 'One custom Google News search string'
        type: string
        default: ''
      queries:
        description: 'Custom JSON array of objects with id and query; use instead of query'
        type: string
        default: '[]'
      requestId:
        description: 'Optional lowercase correlation ID; blank uses the GitHub run ID and attempt'
        type: string
        default: ''
      maxTotal:
        description: 'Maximum unique articles across all topics (1–100)'
        type: string
        default: '100'
      maxArticles:
        description: 'Per-query article limit for the single custom query input (1–100)'
        type: string
        default: '25'
      forceResolve:
        description: 'Resolve known Google links again instead of using successful mappings'
        type: boolean
        default: false
      lookbackHours:
        description: 'Time window for every query in this run, in hours'
        type: choice
        options: ['24', '72']
        default: '24'

permissions:
  contents: read

jobs:
  refresh:
    # Publish combined results and remove expired queries on the default branch only.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch feeds, resolve links, and publish JSON
        run: node src/refresh-news.mjs --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCS_DATA_BRANCH: ${{ github.event.repository.default_branch }}
          SCS_MODE: ${{ inputs.mode || 'active' }}
          SCS_QUERY_IDS: ${{ inputs.queryIds || '[]' }}
          SCS_QUERY: ${{ inputs.query }}
          SCS_QUERIES: ${{ inputs.queries || '[]' }}
          SCS_REQUEST_ID: ${{ inputs.requestId }}
          SCS_MAX_TOTAL: ${{ inputs.maxTotal || '100' }}
          SCS_MAX_ARTICLES: ${{ inputs.maxArticles || '25' }}
          SCS_FORCE_RESOLVE: ${{ inputs.forceResolve || false }}
          SCS_LOOKBACK_HOURS: ${{ inputs.lookbackHours || '24' }}
