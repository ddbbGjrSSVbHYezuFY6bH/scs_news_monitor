name: Refresh news v2
run-name: ${{ inputs.runTimestamp && format('News {0}', inputs.runTimestamp) || 'Prepare timestamped news refresh' }}

on:
  schedule:
    - cron: '17 6 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      runTimestamp:
        description: 'UTC YYYYMMDDHHMMSS; leave blank to generate and dispatch a timestamped run'
        type: string
        default: ''
      mode:
        type: choice
        options: [active, selected, custom]
        default: active
      queryIds:
        description: 'JSON array of saved query IDs for selected mode'
        type: string
        default: '[]'
      query:
        description: 'Single custom query for custom mode'
        type: string
        default: ''
      queries:
        description: 'JSON array of custom queries; use instead of query'
        type: string
        default: '[]'
      requestId:
        description: 'Optional unique correlation ID, distinct from the timestamp'
        type: string
        default: ''
      maxTotal:
        type: string
        default: '100'
      maxArticles:
        type: string
        default: '25'
      forceResolve:
        type: boolean
        default: false
      lookbackHours:
        description: 'Time window for every query in this run, in hours'
        type: choice
        options: ['24', '72']
        default: '24'

permissions:
  contents: read

jobs:
  timestamp:
    if: github.ref_name == github.event.repository.default_branch && !inputs.runTimestamp
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Dispatch a run with a UTC timestamp in its display name
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          MODE: ${{ inputs.mode || 'active' }}
          QUERY_IDS: ${{ inputs.queryIds || '[]' }}
          QUERY: ${{ inputs.query }}
          QUERIES: ${{ inputs.queries || '[]' }}
          REQUEST_ID: ${{ inputs.requestId }}
          MAX_TOTAL: ${{ inputs.maxTotal || '100' }}
          MAX_ARTICLES: ${{ inputs.maxArticles || '25' }}
          FORCE_RESOLVE: ${{ inputs.forceResolve || false }}
          LOOKBACK_HOURS: ${{ inputs.lookbackHours || '24' }}
        run: |
          stamp=$(date -u +%Y%m%d%H%M%S)
          jq -n --arg ref "$REF" --arg stamp "$stamp" --arg mode "$MODE" \
            --arg ids "$QUERY_IDS" --arg query "$QUERY" --arg queries "$QUERIES" \
            --arg request "$REQUEST_ID" --arg total "$MAX_TOTAL" --arg per "$MAX_ARTICLES" \
            --arg force "$FORCE_RESOLVE" --arg lookback "$LOOKBACK_HOURS" \
            '{ref:$ref,inputs:{runTimestamp:$stamp,mode:$mode,queryIds:$ids,query:$query,queries:$queries,requestId:$request,maxTotal:$total,maxArticles:$per,forceResolve:$force,lookbackHours:$lookback}}' > dispatch.json
          gh api "repos/$GH_REPO/actions/workflows/refresh-news-v2.yml/dispatches" --method POST --input dispatch.json

  refresh:
    if: github.ref_name == github.event.repository.default_branch && inputs.runTimestamp != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node src/refresh-news-v2.mjs --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCS_DATA_BRANCH: ${{ github.event.repository.default_branch }}
          SCS_RUN_TIMESTAMP: ${{ inputs.runTimestamp }}
          SCS_MODE: ${{ inputs.mode }}
          SCS_QUERY_IDS: ${{ inputs.queryIds }}
          SCS_QUERY: ${{ inputs.query }}
          SCS_QUERIES: ${{ inputs.queries }}
          SCS_REQUEST_ID: ${{ inputs.requestId }}
          SCS_MAX_TOTAL: ${{ inputs.maxTotal }}
          SCS_MAX_ARTICLES: ${{ inputs.maxArticles }}
          SCS_FORCE_RESOLVE: ${{ inputs.forceResolve }}
          SCS_LOOKBACK_HOURS: ${{ inputs.lookbackHours || '24' }}
