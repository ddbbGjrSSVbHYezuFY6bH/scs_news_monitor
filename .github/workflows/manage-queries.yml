name: Manage queries
run-name: Manage queries (${{ inputs.operation }})

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Create, read, update or delete a saved query'
        type: choice
        options: [create, read, update, delete]
        default: read
        required: true
      queryId:
        description: 'Query ID; leave blank only when reading all queries'
        type: string
        default: ''
      entry:
        description: 'JSON object for create/update; activeUntil: null removes expiry'
        type: string
        default: '{}'

# GitHub authenticates workflow dispatches. Anonymous visitors cannot run this workflow.
permissions:
  contents: read

jobs:
  read:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.operation == 'read'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read saved queries
        run: node src/manage-queries.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCS_DATA_BRANCH: ${{ github.event.repository.default_branch }}
          SCS_OPERATION: ${{ inputs.operation }}
          SCS_QUERY_ID: ${{ inputs.queryId }}
          SCS_ENTRY: ${{ inputs.entry }}

  write:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON('["create","update","delete"]'), inputs.operation)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate and save query changes
        run: node src/manage-queries.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCS_DATA_BRANCH: ${{ github.event.repository.default_branch }}
          SCS_OPERATION: ${{ inputs.operation }}
          SCS_QUERY_ID: ${{ inputs.queryId }}
          SCS_ENTRY: ${{ inputs.entry }}
